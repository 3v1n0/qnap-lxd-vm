# Name of the packaged application.
QPKG_NAME="QNAP_Vsock"
# Display name shown on QTS Web UI (defaults to QPKG_NAME if not set).
QPKG_DISPLAY_NAME="Vsock support for LXD VMs"
# Version of the packaged application.
QPKG_VER="1.0.0"
# Author or maintainer of the package
QPKG_AUTHOR="Marco Trevisan"
# License for the packaged application
QPKG_LICENSE="GPL-2.0"
# One-line description of the packaged application
QPKG_SUMMARY="Enables virtual machines in Container Station's LXD: vsock kernel modules, QEMU and UEFI firmware"

# Preferred number in start/stop sequence. Effectively vestigial: QTS derives the
# numbers, and the /etc/rcS.d/QS<n><name> links it boots from, from the order of
# the sections in /etc/config/qpkg.conf. This package does not reorder that file,
# so it starts after Container Station; see the README.
QPKG_RC_NUM="100"
# Path to the shell script for starting and stopping the application.
QPKG_SERVICE_PROGRAM="qnap-vsock-service.sh"

# Minimum QTS version requirement
QTS_MINI_VERSION="4.2.0"

# Install into the default volume without prompting.
QPKG_VOLUME_SELECT="0"

# Loading the modules is quick; no reason to let a stuck start hold up boot.
QPKG_TIMEOUT="60,30"
